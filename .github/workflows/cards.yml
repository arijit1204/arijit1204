name: Update profile cards

on:
  schedule:
    - cron: "17 0 * * *"   # every day, 05:47 IST
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    paths:
      - "build_cards.py"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_cards.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add commits.svg now-building.svg profile.svg project-*.svg
          git diff --cached --quiet || git commit -m "Update profile cards"
          git push
